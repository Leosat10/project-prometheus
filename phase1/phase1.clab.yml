name: prometheus-phase1

topology:
  nodes:
    spine1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/spine1/daemons:/etc/frr/daemons
        - configs/spine1/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1

    spine2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/spine2/daemons:/etc/frr/daemons
        - configs/spine2/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1

    leaf1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/leaf1/daemons:/etc/frr/daemons
        - configs/leaf1/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1

    leaf2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/leaf2/daemons:/etc/frr/daemons
        - configs/leaf2/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1

    client1:
      kind: linux
      image: alpine:latest

    client2:
      kind: linux
      image: alpine:latest

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "client1:eth1"]
    - endpoints: ["leaf2:eth3", "client2:eth1"]
