frr version 8.4_git
frr defaults traditional
hostname leaf2
no ipv6 forwarding
!
interface eth1
 ip address 10.0.2.2/30
exit
!
interface eth2
 ip address 10.0.4.2/30
exit
!
interface lo
 ip address 4.4.4.4/32
exit
!
router bgp 65002
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 timers 3 9
 neighbor 10.0.4.1 remote-as 65000
 neighbor 10.0.4.1 timers 3 9
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.0.2.1 soft-reconfiguration inbound
  neighbor 10.0.2.1 route-map ALLOW-ALL in
  neighbor 10.0.2.1 route-map ALLOW-ALL out
  neighbor 10.0.4.1 soft-reconfiguration inbound
  neighbor 10.0.4.1 route-map ALLOW-ALL in
  neighbor 10.0.4.1 route-map ALLOW-ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 route-map ALLOW-ALL in
  neighbor 10.0.2.1 route-map ALLOW-ALL out
  neighbor 10.0.4.1 activate
  neighbor 10.0.4.1 route-map ALLOW-ALL in
  neighbor 10.0.4.1 route-map ALLOW-ALL out
  advertise-all-vni
 exit-address-family
exit
!
route-map ALLOW-ALL permit 10
exit
!
